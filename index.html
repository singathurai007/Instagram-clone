<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Instagram Clone — React + Vite</title>

    <meta
      name="description"
      content="A responsive Instagram clone built with React 19, Vite and React Router, featuring stories, a likeable feed and an editable profile backed by a json-server REST API."
    />
    <meta name="theme-color" content="#fafafa" />
    <meta name="color-scheme" content="light dark" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="./src/assets/instagram-logo_971166-164497.avif"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- Apply the saved theme before first paint to avoid a flash of the wrong colours. -->
    <script>
      try {
        var savedTheme = localStorage.getItem("instagram-clone:theme");
        if (savedTheme === "light" || savedTheme === "dark") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (error) {
        /* storage unavailable — fall back to the OS colour scheme */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
